name: Process queued email notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-email-outbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process queued notifications
        env:
          EMAIL_OUTBOX_WORKER_SECRET: ${{ secrets.EMAIL_OUTBOX_WORKER_SECRET }}
        run: |
          if [ -z "$EMAIL_OUTBOX_WORKER_SECRET" ]; then
            echo "EMAIL_OUTBOX_WORKER_SECRET is not configured in GitHub Actions."
            exit 1
          fi
          for attempt in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error --max-time 15 \
              -X POST \
              -H "Authorization: Bearer $EMAIL_OUTBOX_WORKER_SECRET" \
              -H "Content-Type: application/json" \
              --data '{}' \
              https://freshers.rudvay.tech/api/v1/internal/email-outbox/process)"
            echo "$response"
            if echo "$response" | grep -q '"processed":false'; then
              break
            fi
          done
